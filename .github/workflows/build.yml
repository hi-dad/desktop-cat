name: Build

# Code changes are built and checked on every push. Changes to only the README, pictures or docs
# skip the build. A release (the Download link, and the update installed copies are offered) only
# goes out when you ask: Actions → Build → Run workflow with "Publish a release" ticked, or
# `gh workflow run build.yml -f release=true`.
on:
  push:
    paths-ignore: ['**.md', 'LICENSE', 'images/**', 'docs/**', 'previews/**', 'tools/ad/**']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', 'images/**', 'docs/**', 'previews/**', 'tools/ad/**']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (users get offered the update)
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # to publish a release when main changes
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: the build number is the commit count

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      # Your Developer ID certificate (from the repo's secrets) goes into a throwaway keychain for this build only.
      - name: Load signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "" "$kc"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/{print $2; exit}')" >> "$GITHUB_ENV"

      - name: Build the app and DesktopCat.dmg
        run: ./build.sh dist

      # Apple checks the app and issues a ticket; stapling it to the DesktopCat.dmg lets it open without warnings, even offline.
      - name: Notarize with Apple
        timeout-minutes: 45   # Apple usually answers in minutes; don't let a stuck request hang for hours
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          dmg=dist/DesktopCat.dmg
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY" | base64 --decode > "$key"
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          codesign --force --sign "$SIGN_IDENTITY" --timestamp "$dmg"
          out="$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json)"
          echo "$out"
          status="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          if [[ "$status" != Accepted ]]; then
            xcrun notarytool log "$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')" "${auth[@]}"
            exit 1
          fi
          # Apple's ticket server sometimes drops the connection; try a few times.
          for i in 1 2 3 4 5; do xcrun stapler staple "$dmg" && break; [[ $i == 5 ]] && exit 1; sleep 20; done
          rm "$key"

      - name: Verify bundle
        run: |
          test -x "DesktopCat.app/Contents/MacOS/DesktopCat"
          plutil -lint "DesktopCat.app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose "DesktopCat.app"
          lipo "DesktopCat.app/Contents/MacOS/DesktopCat" -verify_arch arm64 x86_64
          hdiutil verify dist/DesktopCat.dmg
          for i in 1 2 3 4 5; do xcrun stapler validate dist/DesktopCat.dmg && break; [[ $i == 5 ]] && exit 1; sleep 20; done
          spctl --assess --type open --context context:primary-signature -v dist/DesktopCat.dmg   # Gatekeeper's verdict

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopCat
          path: dist/DesktopCat.dmg

      # Every update to main becomes the new download behind the README button, plus appcast.xml:
      # the note installed copies read (via Sparkle) to find and install it. The DMG is signed with
      # the Sparkle key so the app only accepts updates that really came from here.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" bin/sign_update
          enclosure="$(echo "$SPARKLE_ED_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - dist/DesktopCat.dmg)"
          plist=DesktopCat.app/Contents/Info.plist
          tag="build-$GITHUB_RUN_NUMBER"
          ENCLOSURE="$enclosure" TAG="$tag" \
          VERSION="$(plutil -extract CFBundleShortVersionString raw $plist)" BUILD="$(plutil -extract CFBundleVersion raw $plist)" \
          NOTES="$(git log -1 --format=%B)" python3 - <<'PY'
          import email.utils, os
          from xml.sax.saxutils import escape
          e = os.environ
          url = f"https://github.com/hi-dad/desktop-cat/releases/download/{e['TAG']}/DesktopCat.dmg"
          paras = [" ".join(p.split()) for p in e["NOTES"].split("\n\n")]  # the commit message, unwrapped
          notes = "".join(f"<p>{escape(p)}</p>" for p in paras if p and not p.startswith("Co-Authored-By"))
          open("dist/appcast.xml", "w").write(f'''<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Desktop Cat</title>
              <item>
                <title>Desktop Cat {e['VERSION']} (build {e['BUILD']})</title>
                <pubDate>{email.utils.formatdate()}</pubDate>
                <sparkle:version>{e['BUILD']}</sparkle:version>
                <sparkle:shortVersionString>{e['VERSION']}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <description>{escape(notes)}</description>
                <enclosure url="{url}" {e['ENCLOSURE']} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          ''')
          PY
          cat dist/appcast.xml
          gh release create "$tag" dist/DesktopCat.dmg dist/appcast.xml \
            --target "$GITHUB_SHA" --latest \
            --title "Desktop Cat $(plutil -extract CFBundleShortVersionString raw $plist) (build $GITHUB_RUN_NUMBER)" --generate-notes
